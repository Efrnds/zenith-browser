name: Build and test
on: [push, pull_request, workflow_dispatch]
jobs:
  linux:
    runs-on: ubuntu-24.04
    env:
      WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: '1'
    strategy:
      fail-fast: false
      matrix:
        build: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config qt6-base-dev libqt6svg6-dev libwebkit2gtk-4.1-dev libsecret-1-dev libx11-dev xvfb dbus-x11 libxcb-cursor0
          if [ '${{ matrix.build }}' = 'Release' ]; then sudo apt-get install -y flatpak flatpak-builder; fi
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build }} -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Unit and WebKit integration tests
        run: |
          validation_options=()
          if [ '${{ matrix.build }}' = 'Release' ]; then validation_options+=(--package); fi
          dbus-run-session -- xvfb-run -a python3 tools/validate-release.py --build build --output build/validation --isolate-tests "${validation_options[@]}"
      - name: Build and smoke-test Flatpak
        if: matrix.build == 'Release'
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub org.gnome.Platform//50 org.gnome.Sdk//50
          flatpak-builder --user --force-clean --disable-rofiles-fuse --install-deps-from=flathub \
            --repo=flatpak-repo flatpak-build packaging/io.github.efrnds.ZenithBrowser.yml
          version=$(cat build/zenith-version.txt)
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            flatpak-repo "build/validation/packages/ZenithBrowser-${version}-Linux.flatpak" \
            io.github.efrnds.ZenithBrowser stable
          flatpak install --user --noninteractive --bundle \
            "build/validation/packages/ZenithBrowser-${version}-Linux.flatpak"
          flatpak run io.github.efrnds.ZenithBrowser --version
          dbus-run-session -- xvfb-run -a flatpak run io.github.efrnds.ZenithBrowser --private --smoke-test
          (cd build/validation/packages && sha256sum ZenithBrowser-* > SHA256SUMS)
      - name: Collect validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-${{ matrix.build }}
          path: |
            build/validation/
      - uses: actions/upload-artifact@v4
        if: matrix.build == 'Release'
        with:
          name: zenith-linux
          path: |
            build/validation/packages/ZenithBrowser-*.tar.gz
            build/validation/packages/ZenithBrowser-*.flatpak
            build/validation/packages/SHA256SUMS
  sanitizers:
    runs-on: ubuntu-24.04
    env:
      WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config qt6-base-dev libqt6svg6-dev libwebkit2gtk-4.1-dev libsecret-1-dev libx11-dev xvfb dbus-x11 libxcb-cursor0
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DZENITH_SANITIZERS=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Unit tests
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: dbus-run-session -- xvfb-run -a python3 tools/validate-release.py --build build --output build/validation --isolate-tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-sanitizers
          path: build/validation/

  windows:
    name: Windows ${{ matrix.arch }} (WebView2)
    runs-on: windows-2022
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            qt_arch: win64_msvc2022_64
            qt_host: windows
            vs_arch: x64
          - arch: arm64
            qt_arch: win64_msvc2022_arm64
            qt_host: windows_arm64
            vs_arch: ARM64
    steps:
      - uses: actions/checkout@v4
      - name: Install WebView2 SDK
        shell: pwsh
        run: |
          $version = '1.0.4258.31'
          $packageId = 'microsoft.web.webview2'
          $package = "$packageId.$version.nupkg"
          $url = "https://api.nuget.org/v3-flatcontainer/$packageId/$version/$package"
          Invoke-WebRequest -Uri $url -OutFile $package -MaximumRetryCount 3 -RetryIntervalSec 5
          if (!(Test-Path $package) -or (Get-Item $package).Length -lt 1MB) { throw "NuGet package download is missing or incomplete: $url" }
          New-Item -ItemType Directory -Force webview2-sdk | Out-Null
          $archive = "$packageId.$version.zip"
          Move-Item -Path $package -Destination $archive
          Expand-Archive -Path $archive -DestinationPath webview2-sdk -Force
          if (!(Test-Path 'webview2-sdk/build/native/include/WebView2.h')) { throw 'WebView2 headers missing from NuGet package' }
          $loader = "webview2-sdk/build/native/${{ matrix.arch }}/WebView2LoaderStatic.lib"
          if (!(Test-Path $loader)) { throw "WebView2 loader missing from NuGet package: $loader" }
      - name: Install WebView2 Runtime
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile WebView2RuntimeInstaller.exe
          $installer = Start-Process -FilePath "$PWD/WebView2RuntimeInstaller.exe" -ArgumentList '/silent', '/install' -Wait -PassThru
          if ($installer.ExitCode -ne 0 -and $installer.ExitCode -ne 3010) { throw "WebView2 Runtime installation failed: $($installer.ExitCode)" }
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: ${{ matrix.qt_host }}
          target: desktop
          arch: ${{ matrix.qt_arch }}
          archives: qtbase qtsvg
          cache: true
      - name: Install installer toolchains
        shell: pwsh
        run: choco install nsis wixtoolset --yes --no-progress
      - name: Configure
        shell: pwsh
        run: |
          $webview2Sdk = Join-Path $env:GITHUB_WORKSPACE 'webview2-sdk'
          cmake -S . -B build -G "Visual Studio 17 2022" -A ${{ matrix.vs_arch }} -DBUILD_TESTING=OFF "-DWEBVIEW2_SDK_DIR=$webview2Sdk"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build, deploy Qt, smoke test, and package
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $stage = Join-Path $env:GITHUB_WORKSPACE 'build/stage'
          cmake --install build --config Release --prefix $stage
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ('${{ matrix.arch }}' -eq 'x64') {
            & ".\build\stage\bin\zenith-browser.exe" --version
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & ".\build\stage\bin\zenith-browser.exe" --private --smoke-test
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          cpack --config build/CPackConfig.cmake -B build/packages
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $checksums = Get-ChildItem build/packages -File | Get-FileHash -Algorithm SHA256
          $checksumLines = $checksums | ForEach-Object { "$($_.Hash.ToLower())  $([System.IO.Path]::GetFileName($_.Path))" }
          Set-Content -Path build/packages/SHA256SUMS-windows-${{ matrix.arch }} -Value $checksumLines -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: zenith-windows-${{ matrix.arch }}
          if-no-files-found: error
          path: build/packages/*

  macos:
    name: macOS (WKWebView)
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: mac
          target: desktop
          arch: clang_64
          archives: qtbase qtsvg
          cache: true
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
      - name: Build, deploy Qt, and smoke test
        run: |
          cmake --build build --parallel 2
          ./build/zenith-browser.app/Contents/MacOS/zenith-browser --version
          ./build/zenith-browser.app/Contents/MacOS/zenith-browser --private --smoke-test
          macdeployqt "$PWD/build/zenith-browser.app" -always-overwrite -dmg
          dmg=$(find . -maxdepth 3 -type f -name '*.dmg' -not -path './build/packages/*' -print -quit)
          test -n "$dmg"
          mkdir -p build/packages
          mv "$dmg" build/packages/ZenithBrowser-macOS.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: zenith-macos
          if-no-files-found: error
          path: build/packages/ZenithBrowser-macOS.dmg
