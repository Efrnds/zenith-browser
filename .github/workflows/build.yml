name: Build and test
on: [push, pull_request, workflow_dispatch]
jobs:
  linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        build: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config qt6-base-dev libqt6svg6-dev libwebkit2gtk-4.1-dev libsecret-1-dev libx11-dev xvfb dbus-x11 libxcb-cursor0
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build }} -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Unit and WebKit integration tests
        run: |
          validation_options=()
          if [ '${{ matrix.build }}' = 'Release' ]; then validation_options+=(--package); fi
          dbus-run-session -- xvfb-run -a python3 tools/validate-release.py --build build --output build/validation "${validation_options[@]}"
      - name: Collect validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-${{ matrix.build }}
          path: |
            build/validation/
      - uses: actions/upload-artifact@v4
        if: matrix.build == 'Release'
        with:
          name: zenith-linux
          path: build/validation/packages/ZenithBrowser-*.tar.gz
  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config qt6-base-dev libqt6svg6-dev libwebkit2gtk-4.1-dev libsecret-1-dev libx11-dev xvfb dbus-x11 libxcb-cursor0
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DZENITH_SANITIZERS=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Unit tests
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: dbus-run-session -- xvfb-run -a python3 tools/validate-release.py --build build --output build/validation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-sanitizers
          path: build/validation/
