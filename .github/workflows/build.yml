name: Build and test
on: [push, pull_request, workflow_dispatch]
jobs:
  linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        build: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config qt6-base-dev libqt6svg6-dev libwebkit2gtk-4.1-dev libsecret-1-dev libx11-dev xvfb dbus-x11 libxcb-cursor0
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build }} -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Unit and WebKit integration tests
        run: dbus-run-session -- xvfb-run -a env ZENITH_REQUIRE_DISPLAY=1 ctest --test-dir build --output-on-failure --timeout 180
      - name: Package
        if: matrix.build == 'Release'
        run: cd build && cpack -G TGZ
      - name: Browser startup smoke
        run: |
          task_profile=$(mktemp -d)
          dbus-run-session -- xvfb-run -a env XDG_CONFIG_HOME="$task_profile/config" XDG_DATA_HOME="$task_profile/data" XDG_CACHE_HOME="$task_profile/cache" timeout 20s build/zenith-browser --private --smoke-test
      - uses: actions/upload-artifact@v4
        if: matrix.build == 'Release'
        with:
          name: zenith-linux
          path: build/ZenithBrowser-*.tar.gz
  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config qt6-base-dev libqt6svg6-dev libwebkit2gtk-4.1-dev libsecret-1-dev libx11-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DZENITH_SANITIZERS=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Unit tests
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: ctest --test-dir build --output-on-failure
