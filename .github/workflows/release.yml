name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config qt6-base-dev libqt6svg6-dev libwebkit2gtk-4.1-dev libsecret-1-dev libx11-dev xvfb dbus-x11 libxcb-cursor0 flatpak flatpak-builder
      - name: Configure and verify tag
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          test "$GITHUB_REF_NAME" = "v$(cat build/zenith-version.txt)"
      - name: Build
        run: cmake --build build --parallel 2
      - name: Unit and browser integration tests
        run: dbus-run-session -- xvfb-run -a python3 tools/validate-release.py --build build --output build/validation --isolate-tests --package
      - name: Build Flatpak bundle
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub org.gnome.Platform//50 org.gnome.Sdk//50
          flatpak-builder --user --force-clean --disable-rofiles-fuse --install-deps-from=flathub \
            --repo=flatpak-repo flatpak-build packaging/io.github.efrnds.ZenithBrowser.yml
          version=$(cat build/zenith-version.txt)
          mkdir -p build/validation/packages
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            flatpak-repo "build/validation/packages/ZenithBrowser-${version}-Linux.flatpak" \
            io.github.efrnds.ZenithBrowser stable
          flatpak install --user --noninteractive --bundle \
            "build/validation/packages/ZenithBrowser-${version}-Linux.flatpak"
          flatpak run io.github.efrnds.ZenithBrowser --version
          dbus-run-session -- xvfb-run -a flatpak run io.github.efrnds.ZenithBrowser --private --smoke-test
          (cd build/validation/packages && sha256sum ZenithBrowser-* > SHA256SUMS)
      - name: Sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: |
          cmake -S . -B sanitize -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DZENITH_SANITIZERS=ON
          cmake --build sanitize --parallel 2
          dbus-run-session -- xvfb-run -a python3 tools/validate-release.py --build sanitize --output sanitize/validation --isolate-tests
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          if-no-files-found: error
          path: |
            build/validation/packages/ZenithBrowser-*.tar.gz
            build/validation/packages/ZenithBrowser-*.flatpak
            build/validation/packages/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-test-logs
          path: |
            build/validation/
            sanitize/validation/
  draft:
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-linux
          path: artifacts
      - name: Verify artifacts
        working-directory: artifacts
        run: sha256sum --check SHA256SUMS
      - name: Create release draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          release_flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then release_flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" artifacts/ZenithBrowser-*.tar.gz artifacts/ZenithBrowser-*.flatpak artifacts/SHA256SUMS --verify-tag --draft --title "Zenith $RELEASE_TAG" --generate-notes "${release_flags[@]}"
